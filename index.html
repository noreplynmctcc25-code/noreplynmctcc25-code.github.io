:root{--ios:cubic-bezier(.32,.72,0,1);--iosb:cubic-bezier(.34,1.3,.64,1);--bsh:0 1px 2px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.06)}
button{transition:transform .38s var(--ios),box-shadow .25s ease,background-color .25s ease,border-color .25s ease,color .2s ease,opacity .2s ease}
button:not(.mt):not(.pfb):not(.fab){box-shadow:var(--bsh)}
button.pri{box-shadow:0 2px 6px color-mix(in srgb,var(--pri) 38%,transparent),0 1px 2px rgba(0,0,0,.14)}
button:hover:not(:disabled):not(.mt){box-shadow:0 2px 4px rgba(15,23,42,.12),0 6px 14px rgba(15,23,42,.08)}
button.pri:hover:not(:disabled){box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 45%,transparent),0 1px 3px rgba(0,0,0,.16)}
button:active:not(:disabled):not(.fab){transform:scale(.96);transition-duration:.1s;box-shadow:0 1px 1px rgba(15,23,42,.10)}
button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none!important}

.tbw .tbs2 button.on{box-shadow:0 1px 2px rgba(0,0,0,.18),0 3px 8px color-mix(in srgb,var(--pri) 30%,transparent)!important;transition:background-color .3s var(--ios),color .3s var(--ios),box-shadow .3s var(--ios)}
nav .mt{transition:background-color .35s var(--ios),color .25s ease,transform .38s var(--ios)}
nav .mt:active{transform:scale(.92)}
@keyframes iosFade{from{opacity:0}to{opacity:1}}
@keyframes iosPop{from{opacity:0;transform:scale(1.1)}to{opacity:1;transform:none}}
@keyframes iosOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97)}}
@keyframes iosSheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes iosSheetOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes iosPage{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
#mdl,.spk{-webkit-backdrop-filter:blur(8px) saturate(140%);backdrop-filter:blur(8px) saturate(140%);background:rgba(15,23,42,.38);animation:iosFade .3s ease both}

<div class=card><h2>Item analysis procedure</h2><div class=gd>
<div class=st><b class=h>1. Score and rank</b>Score the N papers and rank them from highest to lowest.</div>
<div class=st><b class=h>2. Group size</b>Multiply N by 0.30 and round to the nearest whole number. Call it n.</div>
<div class=st><b class=h>3. Upper group</b>Take the top n papers.</div>
<div class=st><b class=h>4. Lower group</b>Take the bottom n papers. Set the middle papers aside.</div>
<div class=st><b class=h>5. Build the table</b>Item no., UG, LG, Df, description, Ds, description, remarks.</div>
<div class=st><b class=h>6. Difficulty</b>Df = (Pu + Pl) ÷ 2, then read the level in the Df table.</div>
<div class=st><b class=h>7. Discrimination</b>Ds = Pu − Pl, then read the level in the Ds table.</div>

let srt='';                                   // "release up to" period chosen on the Student records screen
const MAILRE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;     // simple check that an email address looks valid

/* BACALSO, HELEN -> Bacalso, Helen */
const tcase=s=>String(s||'').toLowerCase().replace(/(^|[\s\-.'(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
/* default period = the latest term that already has grades */
const srUpto=c=>{if(TERMS.some(x=>x[0]==srt))return srt;
 for(let i=TERMS.length-1;i>=0;i--){const t=TERMS[i][0];if(c.students.some(s=>grades(c,s.id)[t].g!=null))return t}
 return 'prelim'};
const passNote=c=>c.hi?`Passing grade: ${c.pass} or higher.`:`Passing grade: ${c.pass} or better (a lower number is a better grade).`;

/* ---------- 1. the data of one student's record ---------- */
/* the lowest percent that still passes, read from the term's grade table (so it follows the class's passing mark) */
const passPct=(c,t)=>{const S=c.scales[c.terms[t].scale]||c.scales.A,r=S.find(([m,v])=>c.hi?v>=c.pass:v<=c.pass);return r?r[0]:75};

const sigLv=(p,pp)=>p==null?0:p<pp?1:p<Math.min(pp+10,98)?2:p<Math.min(pp+20,99)?3:4;
const SIGN={4:'Best',3:'Better',2:'Good',1:'Poor'},SIGC={4:'#1e8a5a',3:'#4c9a2a',2:'#e0a100',1:'#c93a3a'};
function srData(c,s,upto){
 const m=c.meta,g=grades(c,s.id),last=TERMS.findIndex(x=>x[0]==upto),num=v=>+(+v).toFixed(2),TS=TERMS.slice(0,last+1);
 const terms=TS.map(([t,lab])=>({t,lab,score:g[t].x,grade:g[t].g}));
 /* ONE table for every period. For each component / sub-part and period: Count (how many taken out of how many given),
    Score (points got out of total points, gross: no reduction shown) and a signal. Everything is listed, even with no score. */
 const comps=[],K={},sub=(k,name,ti,cell)=>{const key=String(name).trim().toLowerCase();let x=k.sk[key];if(!x){x=k.sk[key]={name,sub:1,cells:TS.map(()=>null)};k.subs.push(x)}x.cells[ti]=cell};

 const one=(t,sx,pp)=>{const v=sc(t,s.id)[sx.id]||[],h=sx.items.map((x,i)=>+x.m>0||c.students.some(z=>(sc(t,z.id)[sx.id]||[])[i]!=null)),
   n=h.filter(Boolean).length,got=h.filter((x,i)=>x&&v[i]!=null).length,mxv=sum(sx.items.map((x,i)=>h[i]?x.m:0)),to=Math.min(mxv,sum(sx.items.map((x,i)=>h[i]?ci(sx,v,i):0))),
   p=mxv>0?to/mxv*100:null;   /* signal uses the gross score, never the reduced one */
   return{n,got,mxv,to,p,w:+sx.w||0,cell:{cnt:n?got+'/'+n:'',sc:mxv>0?num(to)+'/'+num(mxv):'',lv:sigLv(p,pp)}}};
 TS.forEach(([t],ti)=>{const pp=passPct(c,t);c.terms[t].comps.forEach(cp=>{
  let k=K[cp.id];if(!k){k=K[cp.id]={name:cp.name,sub:0,cells:TS.map(()=>null),subs:[],sk:{}};comps.push(k)}
  if(cp.subs.length==1&&cp.subs[0].att){const sx=cp.subs[0],v=sc(t,s.id)[sx.id]||[],A=AT(c),
    hi=sx.items.map((_,i)=>c.students.some(z=>(sc(t,z.id)[sx.id]||[])[i])),d=hi.filter(Boolean).length,
    pr=hi.filter((x,i)=>x&&v[i]=='P').length,la=hi.filter((x,i)=>x&&v[i]=='L').length,to=pr*A.p+la*A.l,mxv=d*A.p;

const T3=R=>TERMS.map(([t,lab],i)=>R.terms[i]||{t,lab,off:1,grade:null});
const SRNOTE='Count: how many were taken out of how many were given (for attendance, sessions attended, present or late, out of sessions held; Late and Absent are plain counts). Score: points earned out of total points.';
